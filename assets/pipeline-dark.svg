<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-label="leetloop pipeline: Ayush solves on leetcode.com; Job 1 fetches with the session cookie and commits the raw file; Job 2, scheduled Claude with no credentials, writes a revision page; an AST gate checks it and the result is pushed to a feature branch; Job 3 promote re-runs the same AST gate on independent infrastructure and fast-forwards main, or refuses and files an issue; Job 4 watchdog monitors for overdue annotations; the loop returns to Ayush">
  <title>leetloop pipeline</title>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes flow { to { stroke-dashoffset: -13; } }
    .flow { animation: flow 1.6s linear infinite; }
    @keyframes halo { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.45; } }
    .halo { animation: halo 3.6s ease-in-out infinite; }
    .runner { opacity: 0; }
    @supports (offset-path: path("M0 0 L4 4")) {
      .runner {
        opacity: 1;
        offset-path: path("M1414 334 L1414 442 Q1414 458 1398 458 L142 458 Q126 458 126 442 L126 296");
        animation: run 16s linear infinite;
      }
    }
    @keyframes run {
      0% { offset-distance: 0%; opacity: 0; }
      6% { opacity: 1; }
      94% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .halo, .runner { animation: none; }
      .runner { opacity: 0; }
    }
  </style>
  <defs>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffa116"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a371f7"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff5c7c"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#39c5cf"/></marker>
  </defs>

  <rect x="1" y="1" width="1498" height="618" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="36" y="52" font-size="12" letter-spacing="2.5" fill="#8b949e"><tspan fill="#e6edf3" font-weight="600">LEETLOOP</tspan><tspan> · A REVISION LOOP WITH NO HUMAN IN IT</tspan></text>

  <!-- human -->
  <rect x="36" y="170" width="180" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="64" cy="200" r="5" fill="#ffa116"/>
  <text x="78" y="205" font-size="16" font-weight="600" fill="#e6edf3">Ayush</text>
  <text x="59" y="231" font-size="11.5" fill="#8b949e">solves a problem on</text>
  <text x="59" y="248" class="mono" font-size="11.5" fill="#ffa116">leetcode.com</text>
  <rect x="59" y="258" width="62" height="20" rx="10" fill="#ffa116" fill-opacity="0.12" stroke="#ffa116" stroke-opacity="0.4"/>
  <text x="90" y="272" text-anchor="middle" class="mono" font-size="10" fill="#ffa116">Python</text>

  <path d="M220 222 L252 222" class="flow" fill="none" stroke="#ffa116" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-amber)"/>
  <text x="236" y="210" text-anchor="middle" font-size="10" fill="#8b949e">solution</text>

  <!-- job 1 region -->
  <rect x="260" y="80" width="272" height="260" rx="14" fill="#1f6feb" fill-opacity="0.08" stroke="#1f6feb" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="284" cy="111" r="5" fill="#58a6ff"/>
  <text x="296" y="116" font-size="15" font-weight="600" fill="#79c0ff">Job 1 · fetch</text>
  <text x="516" y="116" text-anchor="end" class="mono" font-size="11" fill="#8b949e">17:00 UTC</text>
  <text x="276" y="140" font-size="11" fill="#8b949e">GitHub Action · calls no AI model</text>
  <rect x="276" y="156" width="240" height="34" rx="17" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-opacity="0.45"/>
  <g stroke="#79c0ff" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="292" cy="173" r="4.5"/>
    <path d="M296.5 173 L312 173 M307 173 L307 178 M312 173 L312 178"/>
  </g>
  <text x="320" y="177" class="mono" font-size="10.5" fill="#79c0ff">holds LeetCode session cookie</text>
  <rect x="276" y="206" width="240" height="108" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="292" y="234" font-size="12.5" font-weight="600" fill="#e6edf3">commits the submission</text>
  <text x="292" y="258" class="mono" font-size="10.5" fill="#3fb950">+ data/raw/two-sum.py</text>
  <text x="292" y="280" class="mono" font-size="10.5" fill="#8b949e">verbatim · byte-for-byte</text>

  <!-- security boundary -->
  <path d="M552 78 L552 196 M552 240 L552 352" fill="none" stroke="#8b949e" stroke-opacity="0.5" stroke-width="1.25" stroke-dasharray="3 6"/>
  <text x="552" y="66" text-anchor="middle" font-size="10" letter-spacing="2" fill="#8b949e">SECURITY BOUNDARY</text>
  <text x="552" y="372" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">the cookie never crosses</text>
  <path d="M536 222 L566 222" class="flow" fill="none" stroke="#58a6ff" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-blue)"/>
  <text x="552" y="212" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">commit</text>

  <!-- job 2 region -->
  <rect x="572" y="80" width="272" height="260" rx="14" fill="#8957e5" fill-opacity="0.09" stroke="#8957e5" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="596" cy="111" r="5" fill="#a371f7"/>
  <text x="608" y="116" font-size="15" font-weight="600" fill="#d2a8ff">Job 2 · annotate</text>
  <text x="828" y="116" text-anchor="end" class="mono" font-size="11" fill="#8b949e">2 pm ET</text>
  <text x="592" y="140" font-size="11" fill="#8b949e">scheduled Claude · the agent is the model</text>
  <rect x="592" y="156" width="240" height="34" rx="17" fill="#8957e5" fill-opacity="0.16" stroke="#8957e5" stroke-opacity="0.45"/>
  <g stroke="#d2a8ff" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="608" cy="173" r="4.5"/>
    <path d="M612.5 173 L628 173 M623 173 L623 178 M628 173 L628 178"/>
  </g>
  <path d="M601 181 L633 165" stroke="#ff5c7c" stroke-width="1.6" stroke-linecap="round"/>
  <text x="640" y="177" class="mono" font-size="10.5" fill="#d2a8ff">no credentials · no API key</text>
  <rect x="592" y="206" width="240" height="108" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="608" y="234" font-size="12.5" font-weight="600" fill="#e6edf3">writes a revision page</text>
  <text x="608" y="258" class="mono" font-size="10.5" fill="#a371f7"># insight · pitfalls · redo cold</text>
  <text x="608" y="280" class="mono" font-size="10.5" fill="#8b949e">problems/0001-two-sum/</text>

  <path d="M848 222 L858 222" class="flow" fill="none" stroke="#a371f7" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-purple)"/>

  <!-- AST gate · run 1 -->
  <text x="922" y="152" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">ast(raw) == ast(new)</text>
  <path class="halo" d="M922 168 L982 222 L922 276 L862 222 Z" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M922 176 L974 222 L922 268 L870 222 Z" fill="#2ea44f" fill-opacity="0.14" stroke="#3fb950" stroke-width="1.75"/>
  <text x="922" y="214" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3fb950">AST</text>
  <text x="922" y="229" text-anchor="middle" font-size="10" letter-spacing="1" fill="#3fb950">gate</text>
  <text x="922" y="246" text-anchor="middle" font-size="8.5" letter-spacing="0.5" fill="#3fb950">run 1</text>

  <path d="M986 222 L996 222" class="flow" fill="none" stroke="#3fb950" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-green)"/>

  <!-- feature branch: pushed, not on main -->
  <rect x="1000" y="170" width="120" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="1014" y="202" font-size="12.5" font-weight="600" fill="#e6edf3">feature branch</text>
  <text x="1014" y="226" class="mono" font-size="10" fill="#a371f7">annotate/two-sum</text>
  <text x="1014" y="244" class="mono" font-size="10" fill="#3fb950">comments only</text>
  <text x="1014" y="262" class="mono" font-size="10" fill="#8b949e">not on main yet</text>

  <path d="M1124 222 L1132 222" class="flow" fill="none" stroke="#39c5cf" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-teal)"/>

  <!-- job 3 region · the gate runs again, elsewhere -->
  <rect x="1136" y="80" width="212" height="260" rx="14" fill="#39c5cf" fill-opacity="0.08" stroke="#39c5cf" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1158" cy="111" r="5" fill="#39c5cf"/>
  <text x="1170" y="116" font-size="15" font-weight="600" fill="#56d4dd">Job 3 · promote</text>
  <text x="1332" y="116" text-anchor="end" class="mono" font-size="11" fill="#8b949e">on push</text>
  <text x="1152" y="140" font-size="11" fill="#8b949e">GitHub Action · re-runs the gate</text>
  <rect x="1152" y="156" width="184" height="34" rx="17" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.45"/>
  <g stroke="#56d4dd" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1164" y="169" width="12" height="9" rx="2"/>
    <path d="M1166.5 169 L1166.5 166 A3.5 3.5 0 0 1 1173.5 166 L1173.5 169"/>
  </g>
  <text x="1186" y="177" class="mono" font-size="10.5" fill="#56d4dd">out of Job 2's reach</text>
  <text x="1242" y="208" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">ast(raw) == ast(new)</text>
  <text x="1242" y="222" text-anchor="middle" font-size="10" fill="#56d4dd">again · independently</text>
  <path class="halo" d="M1242 228 L1302 282 L1242 336 L1182 282 Z" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M1242 236 L1294 282 L1242 328 L1190 282 Z" fill="#2ea44f" fill-opacity="0.14" stroke="#3fb950" stroke-width="1.75"/>
  <text x="1242" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3fb950">AST</text>
  <text x="1242" y="289" text-anchor="middle" font-size="10" letter-spacing="1" fill="#3fb950">gate</text>
  <text x="1242" y="306" text-anchor="middle" font-size="8.5" letter-spacing="0.5" fill="#3fb950">run 2</text>

  <path d="M1306 282 L1356 282" class="flow" fill="none" stroke="#3fb950" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-green)"/>

  <!-- main: the only way in is a second green light -->
  <rect x="1364" y="230" width="100" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M1378 259 L1384 265 L1395 252" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1402" y="264" class="mono" font-size="13" font-weight="700" fill="#e6edf3">main</text>
  <text x="1378" y="292" class="mono" font-size="10" fill="#3fb950">fast-forward</text>
  <text x="1378" y="310" class="mono" font-size="10" fill="#8b949e">append-only</text>

  <!-- rejected at run 1 -->
  <path d="M922 272 L922 316" fill="none" stroke="#ff5c7c" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#m-red)"/>
  <text x="936" y="298" class="mono" font-size="10" fill="#ff5c7c">trees differ</text>
  <rect x="856" y="324" width="132" height="56" rx="10" fill="#ff375f" fill-opacity="0.08" stroke="#ff5c7c" stroke-opacity="0.55"/>
  <text x="922" y="347" text-anchor="middle" font-size="12" font-weight="600" fill="#ff5c7c">discarded</text>
  <text x="922" y="366" text-anchor="middle" class="mono" font-size="9.5" fill="#8b949e">nothing committed</text>

  <!-- rejected at run 2 -->
  <path d="M1242 332 L1242 370" fill="none" stroke="#ff5c7c" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#m-red)"/>
  <text x="1256" y="356" class="mono" font-size="10" fill="#ff5c7c">trees differ</text>
  <rect x="1164" y="378" width="156" height="56" rx="10" fill="#ff375f" fill-opacity="0.08" stroke="#ff5c7c" stroke-opacity="0.55"/>
  <text x="1242" y="401" text-anchor="middle" font-size="12" font-weight="600" fill="#ff5c7c">refused</text>
  <text x="1242" y="420" text-anchor="middle" class="mono" font-size="9.5" fill="#8b949e">issue filed · branch kept</text>

  <!-- the loop closes -->
  <path d="M1414 334 L1414 442 Q1414 458 1398 458 L142 458 Q126 458 126 442 L126 296" class="flow" fill="none" stroke="#ffa116" stroke-opacity="0.9" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#m-amber)"/>
  <text x="520" y="446" text-anchor="middle" font-size="11.5" fill="#8b949e">Ayush reopens the page and solves it again · cold</text>
  <circle class="runner" r="4" fill="#ffa116"/>

  <!-- job 4 · a monitor, off to the side -->
  <path d="M750 492 L750 352" fill="none" stroke="#8b949e" stroke-opacity="0.55" stroke-width="1.25" stroke-dasharray="2 5"/>
  <circle cx="750" cy="348" r="3" fill="none" stroke="#8b949e" stroke-opacity="0.55" stroke-width="1.25"/>
  <text x="760" y="426" class="mono" font-size="10" fill="#8b949e">checks data/manifest.json</text>
  <rect x="570" y="496" width="360" height="88" rx="12" fill="#161b22" stroke="#8b949e" stroke-opacity="0.4" stroke-dasharray="5 5"/>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <path d="M582 519 Q592 509 602 519 Q592 529 582 519 Z"/>
    <circle cx="592" cy="519" r="2.2"/>
  </g>
  <text x="612" y="524" font-size="14" font-weight="600" fill="#e6edf3">Job 4 · watchdog</text>
  <text x="906" y="524" text-anchor="end" class="mono" font-size="11" fill="#8b949e">4 pm ET</text>
  <text x="592" y="546" font-size="11" fill="#8b949e">GitHub Action · a monitor, not a pipeline stage</text>
  <text x="592" y="568" class="mono" font-size="10" fill="#8b949e"><tspan>still un-annotated 30 h after solve?</tspan><tspan dx="6" fill="#ffa116">→ files an issue</tspan></text>
</svg>
